plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def sec01RuntimeHarness = providers.gradleProperty("sec01RuntimeHarness").orNull == "true"
if (sec01RuntimeHarness && gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") || it.toLowerCase().contains("profile") }) {
    throw new GradleException("SEC-01 harness is debug-only")
}

android {
    namespace "com.nuvikoz.edu"
    compileSdk 35

    defaultConfig {
        applicationId "com.nuvikoz.edu"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        manifestPlaceholders = [applicationName: "android.app.Application"]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildTypes {
        debug {
            if (sec01RuntimeHarness) applicationIdSuffix ".sec01test"
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
        release {
            // Release signing is intentionally unconfigured pending separate approval.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    sourceSets {
        if (sec01RuntimeHarness) {
            debug {
                java.srcDir "src/sec01Runtime/kotlin"
                manifest.srcFile "src/sec01Runtime/AndroidManifest.xml"
            }
            androidTest.java.srcDir "src/sec01RuntimeAndroidTest/kotlin"
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.mockito:mockito-core:5.11.0"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
}
